<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | TechHire</title>

    <link rel="stylesheet" href="sesion.css">

</head>


<body>


    <header class="encabezado">

        <a href="../index.html" class="logo">

            <span class="logo-icono">
                { }
            </span>

            <span class="logo-texto">
                TechHire
            </span>

        </a>

    </header>



    <main class="contenedor-login">


        <section class="tarjeta-login">


            <div class="etiqueta">
                BIENVENIDO DE NUEVO
            </div>


            <h1>
                Iniciar sesión
            </h1>


            <p class="descripcion">
                Continúa buscando tu próxima oportunidad.
            </p>



            <form>


                <!-- CORREO -->

                <div class="grupo-campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="tu@correo.com"
                        required
                    >

                </div>

                <div class="grupo-campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="••••••••"
                        required
                    >

                </div>



                <button type="submit" class="boton-principal">
                    INICIAR SESIÓN
                </button>


            </form>



            <p class="crear-cuenta">

                ¿Aún no tienes cuenta?

                <a href="../registro/registro.html">
                    Regístrate
                </a>

            </p>


        </section>


    </main>


</body>

</html>
